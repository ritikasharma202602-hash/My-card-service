<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | My Card Services</title><link rel="stylesheet" href="/style.css"><style>
body{background:#f5f7fa}.admin-wrap{max-width:1100px;margin:55px auto;padding:0 22px}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.admin-head h1{font:700 27px Manrope}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:9px;padding:26px;margin-bottom:20px}.panel h2{font:700 18px Manrope;margin:0 0 18px}.login{max-width:420px;margin:90px auto}.admin-form label{display:block;font-size:12px;margin:13px 0}.admin-form input{width:100%;padding:13px;border:1px solid #dfe5eb;border-radius:5px;margin-top:7px}.admin-form button{margin-top:15px;width:100%}.muted{font-size:12px;color:#748196}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #edf0f3;vertical-align:top}th{color:#6b7a8b;font-size:10px;text-transform:uppercase;letter-spacing:1px}.status{padding:5px 8px;border-radius:20px;background:#edf5f2}.actions select,.actions button{padding:7px;border:1px solid #dfe5eb;border-radius:4px;background:white;font-size:11px}.actions button{cursor:pointer}.hidden{display:none!important}.error{color:#b53b3b;font-size:12px}.topline{display:flex;gap:10px;align-items:center}.topline .muted{margin-left:auto}
</style></head><body><header class="topbar"><a class="brand" href="/"><span class="brand-mark">M</span><span>MY CARD <b>SERVICES</b></span></a><nav><a href="/">View website ↗</a></nav></header><main class="admin-wrap"><section id="loginBox" class="panel login"><h2>Admin sign in</h2><p class="muted">Sign in to view customer enquiries.</p><form id="loginForm" class="admin-form"><label>Username<input name="username" value="admin" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary-btn" type="submit">Sign in</button><p id="loginError" class="error"></p></form></section><section id="dashboard" class="hidden"><div class="admin-head"><div><div class="eyebrow">PRIVATE ADMIN AREA</div><h1>Customer enquiries</h1></div><button id="logout" class="primary-btn">Log out</button></div><div class="panel"><div class="topline"><h2>All submissions</h2><span id="count" class="muted"></span><button id="refresh" class="primary-btn" style="margin-left:auto;padding:9px 14px">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Received</th><th>Customer</th><th>Contact</th><th>Service / message</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" class="muted hidden">No enquiries yet.</p></div></section></main>
<script>
const $=s=>document.querySelector(s), loginBox=$("#loginBox"),dash=$("#dashboard");
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
async function check(){try{const d=await api("/api/admin/me");if(d.authenticated){loginBox.classList.add("hidden");dash.classList.remove("hidden");load()}else{dash.classList.add("hidden");loginBox.classList.remove("hidden")}}catch{loginBox.classList.remove("hidden")}}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginError").textContent="";const f=Object.fromEntries(new FormData(e.target));try{await api("/api/admin/login",{method:"POST",body:JSON.stringify(f)});e.target.reset();check()}catch(err){$("#loginError").textContent=err.message}});
async function load(){try{const items=await api("/api/admin/enquiries");$("#count").textContent=items.length+" total";$("#empty").classList.toggle("hidden",items.length>0);$("#rows").innerHTML=items.map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString()}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.phone)}<br>${esc(x.email||"")}</td><td><b>${esc(x.service)}</b><br>${esc(x.message||"—")}</td><td><span class="status">${esc(x.status)}</span></td><td class="actions"><select data-status="${x.id}"><option ${x.status==="New"?"selected":""}>New</option><option ${x.status==="In progress"?"selected":""}>In progress</option><option ${x.status==="Resolved"?"selected":""}>Resolved</option></select> <button data-delete="${x.id}">Delete</button></td></tr>`).join("");document.querySelectorAll("[data-status]").forEach(el=>el.addEventListener("change",async()=>{await api("/api/admin/enquiries/"+el.dataset.status,{method:"PATCH",body:JSON.stringify({status:el.value})});load()}));document.querySelectorAll("[data-delete]").forEach(el=>el.addEventListener("click",async()=>{if(confirm("Delete this enquiry?")){await api("/api/admin/enquiries/"+el.dataset.delete,{method:"DELETE"});load()}}));}catch(e){alert(e.message)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("#refresh").onclick=load;$("#logout").onclick=async()=>{await api("/api/admin/logout",{method:"POST"});check()};check();
</script></body></html>
